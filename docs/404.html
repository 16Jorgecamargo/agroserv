<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#173F2A" />
<title>Página não encontrada · AgroServ</title>
<script>
(() => {
  const appBase = '/agroserv/app/'
  const { pathname, search, hash } = window.location
  if (pathname.startsWith(appBase) && !hash) {
    const route = pathname.slice(appBase.length).replace(/^index\.html$/, '')
    window.location.replace(`${appBase}${search}#/${route}`)
  }
})()
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/agroserv/assets/brand/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/agroserv/assets/brand/icon-192.png" />
<link rel="apple-touch-icon" href="/agroserv/assets/brand/apple-touch-icon.png" />
<style>
@font-face {
  font-family: 'Manrope';
  src: url('/agroserv/slides/fonts/manrope.woff2') format('woff2');
  font-weight: 200 800;
  font-display: swap;
}
:root {
  --dark: #173F2A;
  --green: #2F6B45;
  --soft: #E6F0E8;
  --bg: #F7F8F5;
  --muted: #667085;
  --ink: #17201A;
  --line: #E4E8E1;
  --white: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100dvh; display: flex; flex-direction: column; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 6px; }
header, footer { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
header { height: 68px; display: flex; align-items: center; }
.logo { display: inline-flex; align-items: center; }
.logo img { display: block; height: 36px; width: auto; }
.icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
main { flex: 1; display: grid; place-items: center; padding: 40px 24px 64px; }
.box { width: 100%; max-width: 560px; text-align: center; background: var(--white); border: 1px dashed var(--line); border-radius: 18px; padding: 48px 32px; animation: rise .6s cubic-bezier(.22,1,.36,1) both; }
.badge { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: var(--soft); color: var(--green); display: grid; place-items: center; font-size: 30px; animation: pop .7s cubic-bezier(.34,1.56,.64,1) .15s both; }
.code { margin-top: 20px; font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
h1 { margin-top: 8px; font-size: clamp(28px, 5vw, 38px); line-height: 1.15; font-weight: 800; letter-spacing: -.03em; }
p { margin-top: 12px; color: var(--muted); line-height: 1.6; }
.actions { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 10px; font-weight: 700; font-size: 15px; transition: background-color .2s, border-color .2s, transform .15s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--green); color: var(--white); }
.btn-primary:hover { background: var(--dark); }
.btn-secondary { background: var(--white); border: 1px solid var(--line); }
.btn-secondary:hover { background: #EEF1EC; }
footer { padding-bottom: 32px; font-size: 14px; color: var(--muted); text-align: center; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .box, .badge { animation: none; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="/agroserv/" aria-label="AgroServ, início">
    <img src="/agroserv/assets/brand/logo-horizontal.png" alt="" width="140" height="36" />
  </a>
</header>
<main>
  <div class="box">
    <div class="badge"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg></div>
    <div class="code">Erro 404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi alterado. Escolha um dos caminhos abaixo para continuar.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/agroserv/">Voltar para o início</a>
      <a class="btn btn-secondary" href="/agroserv/app/">Abrir o app</a>
      <a class="btn btn-secondary" href="/agroserv/slides/">Apresentação</a>
    </div>
  </div>
</main>
<footer>AgroServ · Projeto acadêmico · 2026</footer>
</body>
</html>
